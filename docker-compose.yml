# log 大小限制：每個容器最多保留 3 個 10 MB 的檔案（上限 30 MB），避免長期運作塞滿 SD 卡
# BRouter 每次路徑運算都會寫一行 log，不設限會持續增長
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  brouter:
    build: ./brouter
    environment:
      # 路網檔超過幾天就檢查官方是否有新版（官方約每週更新；有新版才下載，約 34 MB）
      # 開機 1 分鐘後在背景檢查、之後每天檢查；更新後 BRouter 自動重啟，中斷約數秒
      SEGMENTS_MAX_AGE_DAYS: 7
    ports:
      - "17777:17777"
    volumes:
      # 專案放在網路硬碟（rclone / RaiDrive）時，開機若還沒掛載好，
      # 簡寫方式會讓 Docker 在空的掛載點底下自動建資料夾，導致之後掛載失敗；
      # 關閉 create_host_path：路徑不存在時只會讓 brouter 啟動失敗，不會弄髒掛載點
      - type: bind
        source: ./brouter/segments
        target: /segments
        bind:
          create_host_path: false
    restart: unless-stopped
    logging: *default-logging

  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      BROUTER_URL: http://brouter:17777
      # 便利商店資料超過幾天就重新下載（啟動時與之後每天檢查，背景進行，不影響使用）
      STORES_MAX_AGE_DAYS: 30
    volumes:
      # 便利商店資料快取（避免每次重建都重新下載）
      # 使用具名 volume：會自動繼承映像檔中的目錄權限（容器以非 root 的 node 使用者執行）
      - app-data:/app/server/data
    depends_on:
      - brouter
    restart: unless-stopped
    logging: *default-logging

volumes:
  app-data:
