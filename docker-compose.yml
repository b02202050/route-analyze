# log 大小限制：每個容器最多保留 3 個 10 MB 的檔案（上限 30 MB），避免長期運作塞滿 SD 卡
# BRouter 每次路徑運算都會寫一行 log，不設限會持續增長
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  brouter:
    build: ./brouter
    ports:
      - "17777:17777"
    volumes:
      - ./brouter/segments:/segments
    restart: unless-stopped
    logging: *default-logging

  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      BROUTER_URL: http://brouter:17777
    volumes:
      # 便利商店資料快取（避免每次重建都重新下載）
      # 使用具名 volume：會自動繼承映像檔中的目錄權限（容器以非 root 的 node 使用者執行）
      - app-data:/app/server/data
    depends_on:
      - brouter
    restart: unless-stopped
    logging: *default-logging

volumes:
  app-data:
